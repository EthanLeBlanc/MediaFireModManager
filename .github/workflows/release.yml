name: Build and release

# Makes a new release that every copy of the app will offer to install.
#  - Raise VERSION in app_version.py (and add notes to CHANGELOG.md) and push to main, or
#  - push a tag like v2.3.0, or
#  - GitHub website: Actions > Build and release > Run workflow > type the version.
# A push to main whose version already has a release does nothing.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app_version.py", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 2.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}"
          else V=$(python -c "import app_version; print(app_version.VERSION)"); fi
          V="${V#v}"; V="${V#V}"
          if ! [[ "$V" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then echo "Bad version: $V"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${{ github.event_name }}" = "push" ] && git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V is already released - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install requirements
        if: steps.ver.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Stamp the version into the app
        if: steps.ver.outputs.skip != 'true'
        run: python set_version.py ${{ steps.ver.outputs.version }} --repo ${{ github.repository }}

      - name: Build the exe
        if: steps.ver.outputs.skip != 'true'
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name TerpsWorkFlow
          --collect-all tkinterdnd2
          --collect-all customtkinter
          --hidden-import darkdetect
          --hidden-import keyring.backends.Windows
          mediafire_mod_manager.py

      - name: Check the exe starts and reports the right version
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $out = Join-Path $PWD "ver.txt"
          Start-Process -FilePath "dist\TerpsWorkFlow.exe" -ArgumentList "--write-version", "`"$out`"" -Wait
          $v = (Get-Content $out).Trim()
          if ($v -ne "${{ steps.ver.outputs.version }}") { throw "The exe reports version '$v'" }
          Write-Host "exe reports version $v"

      - name: Checksum and release notes
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        run: |
          (cd dist && sha256sum TerpsWorkFlow.exe | cut -d' ' -f1 > TerpsWorkFlow.exe.sha256)
          python release_notes.py ${{ steps.ver.outputs.version }} > notes.md
          cat notes.md

      - name: Publish the release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/TerpsWorkFlow.exe
            dist/TerpsWorkFlow.exe.sha256
